<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻將計分 App v2.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { overscroll-behavior-y: none; }
        /* 滾動條美化 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #065f46; border-radius: 10px; }
        .crown-icon { filter: drop-shadow(0 0 2px gold); }
    </style>
</head>
<body class="bg-emerald-950">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Settings, RotateCcw, FileSpreadsheet, History, Users, Calculator, CheckCircle, AlertCircle, Trash2, Pencil, Crown } from 'lucide-react';

        function App() {
            const [view, setView] = useState('settings'); 
            const [players, setPlayers] = useState(['東', '南', '西', '北']);
            const [scores, setScores] = useState({ '東': 0, '南': 0, '西': 0, '北': 0 });
            const [baseScore, setBaseScore] = useState(30);
            const [taiScore, setTaiScore] = useState(10);
            const [dealer, setDealer] = useState('東'); // 新增莊家狀態
            
            const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQ6VYhn1cCGmySbW83qfOz3m5QPDUGlUDdeYlG3nKWfFFuLsXJ4vFpFFJB0J34LdFFkA/exec';
            const [googleScriptUrl, setGoogleScriptUrl] = useState(DEFAULT_SCRIPT_URL);
            
            const [transactions, setTransactions] = useState([]);
            const [winner, setWinner] = useState(null);
            const [loser, setLoser] = useState(null); 
            const [taiCount, setTaiCount] = useState(1);
            const [isSelfDraw, setIsSelfDraw] = useState(false);
            const [loading, setLoading] = useState(false);
            const [notification, setNotification] = useState(null);

            // 用來預覽計算結果的狀態
            const [previewScore, setPreviewScore] = useState(0);

            useEffect(() => {
                const saved = localStorage.getItem('mahjongState_v2');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    setPlayers(parsed.players || ['東', '南', '西', '北']);
                    setScores(parsed.scores || { '東': 0, '南': 0, '西': 0, '北': 0 });
                    setBaseScore(parsed.baseScore !== undefined ? parsed.baseScore : 30);
                    setTaiScore(parsed.taiScore !== undefined ? parsed.taiScore : 10);
                    setGoogleScriptUrl(parsed.googleScriptUrl || DEFAULT_SCRIPT_URL);
                    setTransactions(parsed.transactions || []);
                    setDealer(parsed.dealer || parsed.players?.[0] || '東');
                }
            }, []);

            useEffect(() => {
                const stateToSave = { players, scores, baseScore, taiScore, googleScriptUrl, transactions, dealer };
                localStorage.setItem('mahjongState_v2', JSON.stringify(stateToSave));
            }, [players, scores, baseScore, taiScore, googleScriptUrl, transactions, dealer]);

            // 計算分數邏輯核心
            const calculateImpact = (currentWinner, currentLoser, currentIsSelfDraw, currentTai, currentDealer) => {
                if (!currentWinner) return null;
                if (!currentIsSelfDraw && !currentLoser) return null;

                const scoreChanges = {};
                players.forEach(p => scoreChanges[p] = 0);
                
                let totalWinAmount = 0;
                let desc = "";

                const calcSingleScore = (tai) => baseScore + (tai * taiScore);

                if (currentIsSelfDraw) {
                    // 自摸
                    players.forEach(p => {
                        if (p !== currentWinner) {
                            // 判斷台數：如果贏家是莊家，或者付錢的人是莊家，台數+1
                            let finalTai = currentTai;
                            if (currentWinner === currentDealer || p === currentDealer) {
                                finalTai += 1;
                            }
                            const amount = calcSingleScore(finalTai);
                            scoreChanges[p] -= amount;
                            scoreChanges[currentWinner] += amount;
                            totalWinAmount += amount;
                        }
                    });
                    desc = `${currentWinner} 自摸 ${currentTai}台${currentWinner === currentDealer ? '(莊)' : ''}`;
                } else {
                    // 放槍
                    let finalTai = currentTai;
                    // 如果贏家是莊家 或 放槍者是莊家，台數+1
                    if (currentWinner === currentDealer || currentLoser === currentDealer) {
                        finalTai += 1;
                    }
                    const amount = calcSingleScore(finalTai);
                    scoreChanges[currentLoser] -= amount;
                    scoreChanges[currentWinner] += amount;
                    totalWinAmount = amount;
                    desc = `${currentLoser} 放槍 ${currentWinner} ${currentTai}台`;
                }

                return { scoreChanges, totalWinAmount, desc };
            };

            // 當選項改變時，更新預覽分數
            useEffect(() => {
                const impact = calculateImpact(winner, loser, isSelfDraw, taiCount, dealer);
                if (impact) {
                    setPreviewScore(impact.totalWinAmount);
                } else {
                    setPreviewScore(0);
                }
            }, [winner, loser, isSelfDraw, taiCount, dealer, baseScore, taiScore]);

            const showNotification = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleResetGame = () => {
                if (confirm('確定要重置所有分數和紀錄嗎？')) {
                    setScores(players.reduce((acc, p) => ({ ...acc, [p]: 0 }), {}));
                    setTransactions([]);
                    setDealer(players[0]);
                    showNotification('遊戲已重置');
                }
            };

            const handleSubmitScore = async () => {
                const impact = calculateImpact(winner, loser, isSelfDraw, taiCount, dealer);
                if (!impact) { showNotification('請確認贏家與輸家', 'error'); return; }

                setLoading(true);
                
                // 更新總分
                const newScores = { ...scores };
                players.forEach(p => {
                    newScores[p] += impact.scoreChanges[p];
                });

                const timestamp = new Date().toLocaleString('zh-TW');
                const newRecord = {
                    id: Date.now(),
                    time: timestamp,
                    winner,
                    loser: isSelfDraw ? '三家' : loser,
                    type: isSelfDraw ? '自摸' : '放槍',
                    tai: taiCount,
                    totalExchanged: impact.totalWinAmount,
                    desc: impact.desc,
                    scoreChanges: impact.scoreChanges, // 儲存詳細的分數變化以便恢復
                    dealerSnapshot: dealer // 紀錄當下的莊家
                };

                setScores(newScores);
                setTransactions([newRecord, ...transactions]);
                
                // 莊家輪替邏輯 (可選): 如果莊家沒胡牌(放槍或閒家自摸)，通常要下莊? 
                // 這裡先保持手動調整莊家，避免規則爭議，但如果莊家胡牌可以提示連莊。
                if (winner === dealer) {
                    showNotification(`莊家(${dealer}) 連莊！`);
                } else {
                    showNotification('紀錄已儲存');
                    // 重置選擇
                    setWinner(null);
                    setLoser(null);
                    setTaiCount(1);
                    setIsSelfDraw(false);
                }

                if (googleScriptUrl) {
                    try {
                        await fetch(googleScriptUrl, {
                            method: 'POST',
                            mode: 'no-cors', 
                            body: JSON.stringify(newRecord)
                        });
                    } catch (error) {
                        console.error("Google Sync Error", error);
                    }
                }
                setLoading(false);
            };

            // 刪除紀錄（恢復分數）
            const handleDeleteTransaction = (id) => {
                if(!confirm("確定要刪除這筆紀錄嗎？分數將會恢復。")) return;

                const targetTx = transactions.find(t => t.id === id);
                if (!targetTx) return;

                // 反向計算分數
                const newScores = { ...scores };
                players.forEach(p => {
                    // 減去當時的變化量
                    newScores[p] -= targetTx.scoreChanges[p];
                });

                setScores(newScores);
                setTransactions(transactions.filter(t => t.id !== id));
                showNotification('紀錄已刪除，分數已恢復');
            };

            // 編輯紀錄 (撤回並帶入輸入框)
            const handleEditTransaction = (tx) => {
                if(!confirm("要編輯這筆紀錄嗎？這將會刪除原紀錄並將資料帶回輸入框。")) return;
                
                // 1. 先執行刪除邏輯
                const newScores = { ...scores };
                players.forEach(p => {
                    newScores[p] -= tx.scoreChanges[p];
                });
                setScores(newScores);
                setTransactions(transactions.filter(t => t.id !== tx.id));

                // 2. 將資料帶回 UI
                setWinner(tx.winner);
                setTaiCount(tx.tai);
                // 如果紀錄中有存當時莊家，則恢復當時莊家，否則維持現狀
                if (tx.dealerSnapshot) setDealer(tx.dealerSnapshot); 
                
                if (tx.type === '自摸') {
                    setIsSelfDraw(true);
                    setLoser(null);
                } else {
                    setIsSelfDraw(false);
                    setLoser(tx.loser);
                }
                
                setView('scorer');
                showNotification('資料已帶回，請修改後重新送出');
            };

            return (
                <div className="min-h-screen bg-emerald-900 text-white font-sans max-w-md mx-auto shadow-2xl flex flex-col">
                    <header className="bg-emerald-800 p-4 flex justify-between items-center shadow-md z-10">
                        <h1 className="text-xl font-bold flex items-center gap-2">
                            <div className="w-8 h-8 bg-white text-emerald-800 rounded flex items-center justify-center font-serif font-black border-2 border-emerald-600">發</div>
                            麻將計分
                        </h1>
                        <div className="flex gap-2">
                            <button onClick={() => setView('history')} className={`p-2 rounded relative ${view === 'history' ? 'bg-emerald-600' : 'hover:bg-emerald-700'}`}>
                                <History size={20} />
                                {transactions.length > 0 && <span className="absolute top-1 right-1 w-2 h-2 bg-yellow-400 rounded-full"></span>}
                            </button>
                            <button onClick={() => setView('settings')} className={`p-2 rounded ${view === 'settings' ? 'bg-emerald-600' : 'hover:bg-emerald-700'}`}>
                                <Settings size={20} />
                            </button>
                        </div>
                    </header>

                    {notification && (
                        <div className={`p-3 text-center text-sm font-bold ${notification.type === 'error' ? 'bg-red-500' : 'bg-green-500'} transition-all fixed top-16 left-0 right-0 max-w-md mx-auto z-50 shadow-lg`}>
                            {notification.msg}
                        </div>
                    )}

                    <main className="flex-1 overflow-y-auto p-4 scroll-smooth">
                        {view === 'scorer' && (
                            <div className="space-y-5">
                                {/* 分數顯示區 */}
                                <div className="grid grid-cols-4 gap-2 bg-emerald-800 p-3 rounded-xl border border-emerald-700 shadow-inner">
                                    {players.map((p) => (
                                        <div key={p} className={`text-center relative p-1 rounded ${dealer === p ? 'bg-yellow-500/10 ring-1 ring-yellow-500/50' : ''}`}>
                                            {dealer === p && <div className="absolute -top-2 left-1/2 -translate-x-1/2 text-yellow-400"><Crown size={12} fill="currentColor" /></div>}
                                            <div className="text-emerald-200 text-xs mb-1 truncate flex justify-center items-center gap-1">
                                                {p}
                                                {dealer === p && <span className="text-[10px] bg-yellow-500 text-emerald-900 px-1 rounded font-bold">莊</span>}
                                            </div>
                                            <div className={`font-mono font-bold text-lg ${scores[p] >= 0 ? 'text-yellow-400' : 'text-red-400'}`}>
                                                {scores[p] > 0 ? `+${scores[p]}` : scores[p]}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-emerald-800/50 p-4 rounded-xl border border-emerald-700 shadow-lg">
                                    {/* 莊家設定區 */}
                                    <div className="mb-4 bg-emerald-900/40 p-2 rounded-lg border border-emerald-600/30">
                                        <label className="text-emerald-200 text-xs mb-2 flex items-center gap-1"><Crown size={12} /> 設定莊家 (莊家輸贏多一台)</label>
                                        <div className="grid grid-cols-4 gap-2">
                                            {players.map(p => (
                                                <button key={p} onClick={() => setDealer(p)} 
                                                    className={`py-1 rounded text-xs font-bold transition-all ${dealer === p ? 'bg-yellow-500 text-emerald-900 ring-2 ring-yellow-300' : 'bg-emerald-700 text-emerald-400 hover:bg-emerald-600'}`}>
                                                    {p}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 贏家區 */}
                                    <div className="mb-4">
                                        <label className="text-emerald-200 text-sm mb-2 block flex items-center gap-2"><CheckCircle size={14} /> 贏家 (胡牌)</label>
                                        <div className="grid grid-cols-4 gap-2">
                                            {players.map(p => (
                                                <button key={p} onClick={() => setWinner(p)} className={`py-3 rounded-lg font-bold transition-all relative ${winner === p ? 'bg-yellow-500 text-emerald-900 scale-105 shadow-lg ring-2 ring-yellow-200' : 'bg-emerald-700 text-emerald-100 hover:bg-emerald-600'}`}>
                                                    {p}
                                                    {dealer === p && winner === p && <span className="absolute top-0 right-0 text-[10px] bg-red-500 text-white px-1 rounded-bl rounded-tr">連莊</span>}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* 輸家/自摸區 */}
                                    <div className="mb-4">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-emerald-200 text-sm flex items-center gap-2"><AlertCircle size={14} /> 放槍者 / 自摸</label>
                                            <button onClick={() => { setIsSelfDraw(!isSelfDraw); setLoser(null); }} className={`text-xs px-3 py-1 rounded-full border transition-colors ${isSelfDraw ? 'bg-yellow-500 text-emerald-900 border-yellow-500 font-bold' : 'border-emerald-500 text-emerald-300 hover:bg-emerald-800'}`}>
                                                {isSelfDraw ? '目前：自摸' : '切換為自摸'}
                                            </button>
                                        </div>
                                        {!isSelfDraw ? (
                                            <div className="grid grid-cols-4 gap-2">
                                                {players.map(p => (
                                                    <button key={p} disabled={winner === p} onClick={() => setLoser(p)} className={`py-3 rounded-lg font-bold transition-all ${winner === p ? 'opacity-20 bg-emerald-900 cursor-not-allowed' : loser === p ? 'bg-red-500 text-white shadow-lg scale-105' : 'bg-emerald-700 hover:bg-emerald-600'}`}>{p}</button>
                                                ))}
                                            </div>
                                        ) : (
                                            <div className="bg-emerald-900/50 p-3 rounded-lg text-center text-yellow-300 text-sm border border-yellow-500/30 flex justify-center items-center gap-2">
                                                <span>🎉 自摸！三家通賠</span>
                                                {winner && dealer && winner !== dealer && <span className="text-[10px] bg-emerald-800 px-1 rounded text-emerald-200">(莊家付 {baseScore + (taiCount+1)*taiScore})</span>}
                                            </div>
                                        )}
                                    </div>

                                    {/* 台數與計算區 */}
                                    <div className="bg-emerald-900/50 p-4 rounded-lg border border-emerald-600 space-y-4">
                                        <div>
                                            <label className="flex justify-between text-sm text-emerald-200 mb-1">
                                                <span>牌面台數 <span className="text-[10px] opacity-70">(不含莊家台)</span></span>
                                                <span className="font-mono text-yellow-400 font-bold">{taiCount} 台</span>
                                            </label>
                                            <input type="range" min="0" max="20" value={taiCount} onChange={(e) => setTaiCount(parseInt(e.target.value))} className="w-full accent-yellow-500 cursor-pointer" />
                                        </div>
                                        
                                        <div className="flex flex-col gap-2">
                                            <div className="flex justify-between items-end border-b border-emerald-700 pb-2">
                                                <span className="text-xs text-emerald-400">贏家總得點 (預估)</span>
                                                <span className="text-2xl font-mono text-white font-bold tracking-wider">
                                                    {previewScore > 0 ? previewScore : '--'}
                                                </span>
                                            </div>
                                            <div className="text-[10px] text-emerald-400 text-right">
                                                {(winner === dealer || loser === dealer || (isSelfDraw && (winner === dealer || dealer))) ? 
                                                    <span className="text-yellow-400">已自動計入莊家台</span> : 
                                                    "一般計分"
                                                }
                                                <span className="ml-2 opacity-50">底:{baseScore} / 台:{taiScore}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <button onClick={handleSubmitScore} disabled={loading} className="w-full mt-6 bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-emerald-900 font-bold py-4 rounded-xl shadow-lg active:scale-95 flex items-center justify-center gap-2 text-lg transition-transform">
                                        {loading ? '處理中...' : <><Calculator size={24} /> 確認記分</>}
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'settings' && (
                            <div className="space-y-6">
                                <button onClick={() => setView('scorer')} className="w-full bg-yellow-500 text-emerald-900 font-bold py-3 rounded-lg shadow-lg flex items-center justify-center gap-2 hover:bg-yellow-400 transition-colors"><CheckCircle size={20} /> 完成設定 / 返回計分</button>
                                
                                <div className="bg-emerald-800 p-4 rounded-xl border border-emerald-700">
                                    <h3 className="font-bold mb-4 flex items-center gap-2 text-yellow-400"><Users size={18} /> 玩家名稱</h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        {players.map((p, idx) => (
                                            <input key={idx} type="text" value={p} onChange={(e) => {
                                                const newPlayers = [...players];
                                                newPlayers[idx] = e.target.value;
                                                setPlayers(newPlayers);
                                            }} className="bg-emerald-900 border border-emerald-600 rounded p-2 text-white focus:ring-2 focus:ring-yellow-500 outline-none" />
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-emerald-800 p-4 rounded-xl border border-emerald-700">
                                    <h3 className="font-bold mb-4 flex items-center gap-2 text-yellow-400"><Calculator size={18} /> 計分規則</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-xs text-emerald-300">底 (Base)</label><input type="number" value={baseScore} onChange={(e) => setBaseScore(parseInt(e.target.value))} className="w-full bg-emerald-900 border border-emerald-600 rounded p-2 mt-1" /></div>
                                        <div><label className="text-xs text-emerald-300">台 (Tai)</label><input type="number" value={taiScore} onChange={(e) => setTaiScore(parseInt(e.target.value))} className="w-full bg-emerald-900 border border-emerald-600 rounded p-2 mt-1" /></div>
                                    </div>
                                </div>

                                <div className="bg-emerald-800 p-4 rounded-xl border border-emerald-700">
                                    <h3 className="font-bold mb-2 flex items-center gap-2 text-green-400"><FileSpreadsheet size={18} /> Google Script URL</h3>
                                    <input type="text" value={googleScriptUrl} onChange={(e) => setGoogleScriptUrl(e.target.value)} className="w-full bg-emerald-900 border border-emerald-600 rounded p-2 text-[10px] text-emerald-200 focus:text-white" placeholder="https://script.google.com/..." />
                                </div>

                                <button onClick={handleResetGame} className="w-full py-3 border border-red-500 text-red-400 rounded-lg flex items-center justify-center gap-2 hover:bg-red-500/10 transition-colors"><RotateCcw size={16} /> 重置所有數據</button>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="h-full flex flex-col">
                                <button onClick={() => setView('scorer')} className="mb-4 text-emerald-300 flex items-center gap-1 hover:text-white transition-colors">← 返回記分板</button>
                                <div className="flex-1 overflow-y-auto space-y-3 pb-4">
                                    {transactions.length === 0 ? <div className="text-center text-emerald-500 mt-10">暫無紀錄</div> : 
                                        transactions.map((t) => (
                                            <div key={t.id} className="bg-emerald-800 p-3 rounded-lg border-l-4 border-yellow-500 flex justify-between items-center group relative overflow-hidden">
                                                <div className="z-10 flex-1">
                                                    <div className="flex items-center gap-2 mb-1">
                                                        <span className="text-[10px] text-emerald-400 bg-emerald-900 px-1 rounded">{t.time.split(' ')[1]}</span>
                                                        <span className="text-[10px] text-emerald-300 border border-emerald-600 px-1 rounded">莊: {t.dealerSnapshot || '?'}</span>
                                                    </div>
                                                    <div className="text-sm font-bold text-white">{t.desc}</div>
                                                </div>
                                                
                                                <div className="flex items-center gap-3 z-10">
                                                    <div className="text-right mr-2">
                                                        <div className="text-yellow-400 font-mono font-bold text-lg">{t.totalExchanged}</div>
                                                        <div className="text-[10px] text-emerald-400">{t.type}</div>
                                                    </div>
                                                    
                                                    {/* 操作按鈕 */}
                                                    <div className="flex gap-1">
                                                        <button onClick={() => handleEditTransaction(t)} className="p-2 bg-emerald-700 rounded text-emerald-200 hover:bg-blue-600 hover:text-white transition-colors" title="編輯 (撤回重填)">
                                                            <Pencil size={16} />
                                                        </button>
                                                        <button onClick={() => handleDeleteTransaction(t.id)} className="p-2 bg-emerald-700 rounded text-emerald-200 hover:bg-red-600 hover:text-white transition-colors" title="刪除">
                                                            <Trash2 size={16} />
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    }
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="p-2 text-center text-[10px] text-emerald-600 border-t border-emerald-800">
                        Mahjong Calc v2.0
                    </footer>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
