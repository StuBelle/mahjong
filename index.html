<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻將計分 App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 避免手機上滑動重新整理 */
        body { overscroll-behavior-y: none; }
    </style>
</head>
<body class="bg-emerald-950">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        // 直接從 CDN 引入圖標
        import { Settings, Save, RotateCcw, FileSpreadsheet, History, Users, Calculator, CheckCircle, AlertCircle } from 'lucide-react';

        // --- 你的原始程式碼開始 (稍作微調以適應單頁) ---

        function App() {
            // 修改：預設進入 'settings' (設定頁面)，方便先輸入名字
            const [view, setView] = useState('settings'); // scorer, settings, history
            const [players, setPlayers] = useState(['東', '南', '西', '北']);
            const [scores, setScores] = useState({ '東': 0, '南': 0, '西': 0, '北': 0 });
            const [baseScore, setBaseScore] = useState(0); // 預設 0 底
            const [taiScore, setTaiScore] = useState(1);   // 預設 1 台 1 點
            const [googleScriptUrl, setGoogleScriptUrl] = useState('');
            const [transactions, setTransactions] = useState([]);
            
            // 計分狀態
            const [winner, setWinner] = useState(null);
            const [loser, setLoser] = useState(null); // null 代表自摸
            const [taiCount, setTaiCount] = useState(1);
            const [manualAmount, setManualAmount] = useState(0);
            const [isSelfDraw, setIsSelfDraw] = useState(false);
            const [loading, setLoading] = useState(false);
            const [notification, setNotification] = useState(null);

            // 初始化讀取本地資料
            useEffect(() => {
                const saved = localStorage.getItem('mahjongState');
                if (saved) {
                const parsed = JSON.parse(saved);
                setPlayers(parsed.players || ['東', '南', '西', '北']);
                setScores(parsed.scores || { '東': 0, '南': 0, '西': 0, '北': 0 });
                setBaseScore(parsed.baseScore !== undefined ? parsed.baseScore : 0);
                setTaiScore(parsed.taiScore !== undefined ? parsed.taiScore : 1);
                setGoogleScriptUrl(parsed.googleScriptUrl || '');
                setTransactions(parsed.transactions || []);
                }
            }, []);

            // 儲存狀態到本地
            useEffect(() => {
                const stateToSave = { players, scores, baseScore, taiScore, googleScriptUrl, transactions };
                localStorage.setItem('mahjongState', JSON.stringify(stateToSave));
            }, [players, scores, baseScore, taiScore, googleScriptUrl, transactions]);

            // 自動計算金額
            useEffect(() => {
                // 公式：底 + (台 * 單價)
                const calculated = baseScore + (taiCount * taiScore);
                setManualAmount(calculated);
            }, [baseScore, taiCount, taiScore]);

            const showNotification = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleResetGame = () => {
                if (confirm('確定要重置所有分數和紀錄嗎？這將會清空目前的戰績。')) {
                setScores(players.reduce((acc, p) => ({ ...acc, [p]: 0 }), {}));
                setTransactions([]);
                showNotification('遊戲已重置，請重新開始');
                }
            };

            const handleSubmitScore = async () => {
                if (!winner) {
                showNotification('請選擇贏家', 'error');
                return;
                }
                if (!isSelfDraw && !loser) {
                showNotification('請選擇放槍者，或勾選自摸', 'error');
                return;
                }
                if (!isSelfDraw && winner === loser) {
                showNotification('贏家和放槍者不能是同一人', 'error');
                return;
                }

                setLoading(true);

                const amount = parseInt(manualAmount);
                const newScores = { ...scores };
                let transactionDesc = '';
                const timestamp = new Date().toLocaleString('zh-TW');

                // 計算分數變動
                if (isSelfDraw) {
                // 自摸：贏家收三家
                players.forEach(p => {
                    if (p === winner) {
                    newScores[p] += amount * 3;
                    } else {
                    newScores[p] -= amount;
                    }
                });
                transactionDesc = `${winner} 自摸 ${taiCount} 台 (每家 ${amount} 點)`;
                } else {
                // 放槍：贏家收一家
                newScores[winner] += amount;
                newScores[loser] -= amount;
                transactionDesc = `${loser} 放槍給 ${winner} (${taiCount} 台, ${amount} 點)`;
                }

                // 建立紀錄物件
                const newRecord = {
                id: Date.now(),
                time: timestamp,
                winner,
                loser: isSelfDraw ? '三家' : loser,
                type: isSelfDraw ? '自摸' : '放槍',
                tai: taiCount,
                amount: amount,
                totalExchanged: isSelfDraw ? amount * 3 : amount,
                desc: transactionDesc
                };

                // 更新本地狀態
                setScores(newScores);
                setTransactions([newRecord, ...transactions]);
                setWinner(null);
                setLoser(null);
                setTaiCount(1);
                setIsSelfDraw(false);

                // 傳送到 Google Sheet
                if (googleScriptUrl) {
                try {
                    await fetch(googleScriptUrl, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(newRecord)
                    });
                    showNotification('紀錄已儲存並同步至 Google Sheet');
                } catch (error) {
                    console.error("Sync error", error);
                    showNotification('本地已儲存，但同步 Google Sheet 失敗', 'error');
                }
                } else {
                showNotification('紀錄已儲存 (僅本地)');
                }
                
                setLoading(false);
            };

            // 渲染頁面組件
            return (
                <div className="min-h-screen bg-emerald-900 text-white font-sans max-w-md mx-auto shadow-2xl overflow-hidden flex flex-col">
                {/* 頂部導航 */}
                <header className="bg-emerald-800 p-4 flex justify-between items-center shadow-md">
                    <h1 className="text-xl font-bold flex items-center gap-2">
                    <div className="w-8 h-8 bg-white text-emerald-800 rounded flex items-center justify-center font-serif font-black border-2 border-emerald-600">發</div>
                    麻將計分
                    </h1>
                    <div className="flex gap-2">
                    <button onClick={() => setView('history')} className={`p-2 rounded ${view === 'history' ? 'bg-emerald-600' : 'hover:bg-emerald-700'}`}>
                        <History size={20} />
                    </button>
                    <button onClick={() => setView('settings')} className={`p-2 rounded ${view === 'settings' ? 'bg-emerald-600' : 'hover:bg-emerald-700'}`}>
                        <Settings size={20} />
                    </button>
                    </div>
                </header>

                {/* 通知訊息 */}
                {notification && (
                    <div className={`p-3 text-center text-sm font-bold ${notification.type === 'error' ? 'bg-red-500' : 'bg-green-500'} animate-pulse`}>
                    {notification.msg}
                    </div>
                )}

                {/* 主要內容區 */}
                <main className="flex-1 overflow-y-auto p-4">
                    
                    {/* === 計分模式 === */}
                    {view === 'scorer' && (
                    <div className="space-y-6">
                        {/* 總分概覽 */}
                        <div className="grid grid-cols-4 gap-2 bg-emerald-800 p-3 rounded-xl border border-emerald-700">
                        {players.map((p) => (
                            <div key={p} className="text-center">
                            <div className="text-emerald-200 text-xs mb-1">{p}</div>
                            <div className={`font-mono font-bold text-lg ${scores[p] >= 0 ? 'text-yellow-400' : 'text-red-400'}`}>
                                {scores[p] > 0 ? `+${scores[p]}` : scores[p]}
                            </div>
                            </div>
                        ))}
                        </div>

                        {/* 操作區 */}
                        <div className="bg-emerald-800/50 p-4 rounded-xl border border-emerald-700 backdrop-blur-sm">
                        
                        {/* 贏家 */}
                        <div className="mb-4">
                            <label className="text-emerald-200 text-sm mb-2 block flex items-center gap-2">
                            <CheckCircle size={14} /> 誰胡牌 (贏家)
                            </label>
                            <div className="grid grid-cols-4 gap-2">
                            {players.map(p => (
                                <button
                                key={`winner-${p}`}
                                onClick={() => setWinner(p)}
                                className={`py-3 rounded-lg font-bold transition-all ${
                                    winner === p 
                                    ? 'bg-yellow-500 text-emerald-900 shadow-lg scale-105' 
                                    : 'bg-emerald-700 hover:bg-emerald-600 text-emerald-100'
                                }`}
                                >
                                {p}
                                </button>
                            ))}
                            </div>
                        </div>

                        {/* 輸家 / 自摸切換 */}
                        <div className="mb-4">
                            <div className="flex justify-between items-center mb-2">
                            <label className="text-emerald-200 text-sm flex items-center gap-2">
                                <AlertCircle size={14} /> 誰放槍 / 自摸
                            </label>
                            <button 
                                onClick={() => { setIsSelfDraw(!isSelfDraw); setLoser(null); }}
                                className={`text-xs px-3 py-1 rounded-full border transition-colors ${isSelfDraw ? 'bg-yellow-500 text-emerald-900 border-yellow-500 font-bold' : 'border-emerald-500 text-emerald-300'}`}
                            >
                                {isSelfDraw ? '目前：自摸' : '切換為自摸'}
                            </button>
                            </div>

                            {!isSelfDraw && (
                            <div className="grid grid-cols-4 gap-2">
                                {players.map(p => (
                                <button
                                    key={`loser-${p}`}
                                    disabled={winner === p}
                                    onClick={() => setLoser(p)}
                                    className={`py-3 rounded-lg font-bold transition-all ${
                                    winner === p 
                                        ? 'opacity-20 cursor-not-allowed bg-emerald-900' 
                                        : loser === p 
                                        ? 'bg-red-500 text-white shadow-lg scale-105' 
                                        : 'bg-emerald-700 hover:bg-emerald-600 text-emerald-100'
                                    }`}
                                >
                                    {p}
                                </button>
                                ))}
                            </div>
                            )}
                            {isSelfDraw && (
                            <div className="bg-emerald-900/50 p-3 rounded-lg text-center text-yellow-300 text-sm border border-yellow-500/30">
                                🎉 自摸！三家通賠
                            </div>
                            )}
                        </div>

                        {/* 台數與金額計算 */}
                        <div className="bg-emerald-900/50 p-4 rounded-lg border border-emerald-600 space-y-4">
                            <div>
                            <label className="flex justify-between text-sm text-emerald-200 mb-1">
                                <span>台數</span>
                                <span className="font-mono">{taiCount} 台</span>
                            </label>
                            <input 
                                type="range" 
                                min="0" max="20" 
                                value={taiCount} 
                                onChange={(e) => setTaiCount(parseInt(e.target.value))}
                                className="w-full accent-yellow-500 h-2 bg-emerald-700 rounded-lg appearance-none cursor-pointer"
                            />
                            <div className="flex justify-between mt-2">
                                {[1, 2, 3, 4, 5, 8].map(t => (
                                <button 
                                    key={t}
                                    onClick={() => setTaiCount(t)}
                                    className="bg-emerald-700 text-xs px-2 py-1 rounded hover:bg-emerald-600"
                                >
                                    {t}
                                </button>
                                ))}
                            </div>
                            </div>

                            <div className="flex items-end gap-3">
                            <div className="flex-1">
                                <label className="text-xs text-emerald-400 block mb-1">單家點數 (可手改)</label>
                                <div className="relative">
                                <span className="absolute left-3 top-2 text-emerald-400">pt</span>
                                <input 
                                    type="number" 
                                    value={manualAmount}
                                    onChange={(e) => setManualAmount(parseInt(e.target.value))}
                                    className="w-full bg-emerald-800 border border-emerald-600 rounded p-2 pl-8 text-xl font-mono text-white focus:border-yellow-500 focus:outline-none"
                                />
                                </div>
                            </div>
                            <div className="text-right text-xs text-emerald-400 mb-2">
                                公式: {baseScore} + {taiCount}×{taiScore}
                            </div>
                            </div>
                        </div>

                        {/* 送出按鈕 */}
                        <button 
                            onClick={handleSubmitScore}
                            disabled={loading}
                            className="w-full mt-6 bg-yellow-500 hover:bg-yellow-400 text-emerald-900 font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2 text-lg"
                        >
                            {loading ? '儲存中...' : (
                            <>
                                <Calculator size={24} />
                                確認記分
                            </>
                            )}
                        </button>
                        </div>
                    </div>
                    )}

                    {/* === 設定頁面 === */}
                    {view === 'settings' && (
                    <div className="space-y-6">
                        {/* 新增：明顯的開始按鈕 */}
                        <button 
                        onClick={() => setView('scorer')} 
                        className="w-full bg-yellow-500 hover:bg-yellow-400 text-emerald-900 font-bold py-3 rounded-lg shadow-lg flex items-center justify-center gap-2 mb-2"
                        >
                        <CheckCircle size={20} /> 完成設定 / 開始計分
                        </button>
                        <p className="text-center text-xs text-emerald-300 mb-4">
                        請先確認下方玩家名稱與規則
                        </p>

                        <div className="bg-emerald-800 p-4 rounded-xl border border-emerald-700">
                        <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-yellow-400">
                            <Users size={18} /> 玩家設定 (必填)
                        </h3>
                        <div className="grid grid-cols-2 gap-3">
                            {players.map((p, idx) => (
                            <div key={idx}>
                                <label className="text-xs text-emerald-400 block mb-1">位置 {['東', '南', '西', '北'][idx]}</label>
                                <input 
                                type="text" 
                                value={p}
                                placeholder={`玩家 ${idx+1}`}
                                onChange={(e) => {
                                    const newPlayers = [...players];
                                    newPlayers[idx] = e.target.value;
                                    setPlayers(newPlayers);
                                    
                                    const oldName = players[idx];
                                    const newName = e.target.value;
                                    if (oldName !== newName) {
                                    const newScores = {...scores};
                                    newScores[newName] = newScores[oldName] || 0;
                                    delete newScores[oldName];
                                    setScores(newScores);
                                    }
                                }}
                                className="w-full bg-emerald-900 border border-emerald-600 rounded p-2 text-white focus:border-yellow-500 focus:outline-none"
                                />
                            </div>
                            ))}
                        </div>
                        </div>

                        <div className="bg-emerald-800 p-4 rounded-xl border border-emerald-700">
                        <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-yellow-400">
                            <Calculator size={18} /> 計分規則
                        </h3>
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                            <label className="text-sm block mb-1">底 (Base 點數)</label>
                            <input 
                                type="number" 
                                value={baseScore}
                                onChange={(e) => setBaseScore(parseInt(e.target.value))}
                                className="w-full bg-emerald-900 border border-emerald-600 rounded p-2 text-white font-mono"
                            />
                            </div>
                            <div>
                            <label className="text-sm block mb-1">台 (每台點數)</label>
                            <input 
                                type="number" 
                                value={taiScore}
                                onChange={(e) => setTaiScore(parseInt(e.target.value))}
                                className="w-full bg-emerald-900 border border-emerald-600 rounded p-2 text-white font-mono"
                            />
                            </div>
                        </div>
                        </div>

                        <div className="bg-emerald-800 p-4 rounded-xl border border-emerald-700">
                        <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-green-400">
                            <FileSpreadsheet size={18} /> Google Sheet 連動
                        </h3>
                        <p className="text-xs text-emerald-200 mb-3 leading-relaxed">
                            若要啟用自動記錄到 Google Sheet，請建立 Google Apps Script (Web App) 並貼上 URL。
                        </p>
                        <input 
                            type="text" 
                            placeholder="https://script.google.com/macros/s/..."
                            value={googleScriptUrl}
                            onChange={(e) => setGoogleScriptUrl(e.target.value)}
                            className="w-full bg-emerald-900 border border-emerald-600 rounded p-2 text-xs text-emerald-200 mb-2 break-all"
                        />
                        </div>

                        <button 
                        onClick={handleResetGame}
                        className="w-full py-3 border border-red-500 text-red-400 rounded-lg hover:bg-red-500/20 flex items-center justify-center gap-2"
                        >
                        <RotateCcw size={16} /> 重置所有數據
                        </button>
                    </div>
                    )}

                    {/* === 歷史紀錄 === */}
                    {view === 'history' && (
                    <div className="h-full flex flex-col">
                        <button onClick={() => setView('scorer')} className="mb-4 text-emerald-300 flex items-center gap-1 hover:text-white">
                        ← 返回記分板
                        </button>
                        <h3 className="font-bold text-lg mb-4 text-yellow-400 flex items-center gap-2">
                        <History size={20} /> 對戰紀錄
                        </h3>
                        
                        <div className="flex-1 overflow-y-auto space-y-2 pb-4">
                        {transactions.length === 0 ? (
                            <div className="text-center text-emerald-500 mt-10">暫無紀錄</div>
                        ) : (
                            transactions.map((t) => (
                            <div key={t.id} className="bg-emerald-800 p-3 rounded-lg border-l-4 border-emerald-500 flex justify-between items-center">
                                <div>
                                <div className="text-xs text-emerald-400 mb-1">{t.time.split(' ')[1]}</div>
                                <div className="font-bold text-white">{t.desc}</div>
                                </div>
                                <div className="text-right">
                                <div className="text-yellow-400 font-mono font-bold text-lg">
                                    {t.totalExchanged} <span className="text-sm font-normal text-emerald-400">pt</span>
                                </div>
                                <div className="text-xs text-emerald-400">{t.type}</div>
                                </div>
                            </div>
                            ))
                        )}
                        </div>
                    </div>
                    )}

                </main>
                
                {/* Footer */}
                <footer className="bg-emerald-900 p-2 text-center text-xs text-emerald-600 border-t border-emerald-800">
                    Mahjong Calc v1.0
                </footer>
                </div>
            );
        }

        // --- 渲染到 HTML 元素 ---
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
