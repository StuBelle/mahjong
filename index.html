<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麻將計分 App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { overscroll-behavior-y: none; }
        /* 滾動條美化 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #065f46; border-radius: 10px; }
    </style>
</head>
<body class="bg-emerald-950">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Settings, Save, RotateCcw, FileSpreadsheet, History, Users, Calculator, CheckCircle, AlertCircle } from 'lucide-react';

        function App() {
            const [view, setView] = useState('settings'); 
            const [players, setPlayers] = useState(['東', '南', '西', '北']);
            const [scores, setScores] = useState({ '東': 0, '南': 0, '西': 0, '北': 0 });
            const [baseScore, setBaseScore] = useState(3); // 預設 3 底
            const [taiScore, setTaiScore] = useState(1);  // 預設 1 台
            
            // 填入你提供的預設 URL
            const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQ6VYhn1cCGmySbW83qfOz3m5QPDUGlUDdeYlG3nKWfFFuLsXJ4vFpFFJB0J34LdFFkA/exec';
            const [googleScriptUrl, setGoogleScriptUrl] = useState(DEFAULT_SCRIPT_URL);
            
            const [transactions, setTransactions] = useState([]);
            const [winner, setWinner] = useState(null);
            const [loser, setLoser] = useState(null); 
            const [taiCount, setTaiCount] = useState(1);
            const [manualAmount, setManualAmount] = useState(0);
            const [isSelfDraw, setIsSelfDraw] = useState(false);
            const [loading, setLoading] = useState(false);
            const [notification, setNotification] = useState(null);

            useEffect(() => {
                const saved = localStorage.getItem('mahjongState');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    setPlayers(parsed.players || ['東', '南', '西', '北']);
                    setScores(parsed.scores || { '東': 0, '南': 0, '西': 0, '北': 0 });
                    setBaseScore(parsed.baseScore !== undefined ? parsed.baseScore : 30);
                    setTaiScore(parsed.taiScore !== undefined ? parsed.taiScore : 10);
                    // 如果本地有存過網址則用本地的，否則用預設
                    setGoogleScriptUrl(parsed.googleScriptUrl || DEFAULT_SCRIPT_URL);
                    setTransactions(parsed.transactions || []);
                }
            }, []);

            useEffect(() => {
                const stateToSave = { players, scores, baseScore, taiScore, googleScriptUrl, transactions };
                localStorage.setItem('mahjongState', JSON.stringify(stateToSave));
            }, [players, scores, baseScore, taiScore, googleScriptUrl, transactions]);

            useEffect(() => {
                const calculated = baseScore + (taiCount * taiScore);
                setManualAmount(calculated);
            }, [baseScore, taiCount, taiScore]);

            const showNotification = (msg, type = 'success') => {
                setNotification({ msg, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleResetGame = () => {
                if (confirm('確定要重置所有分數和紀錄嗎？')) {
                    setScores(players.reduce((acc, p) => ({ ...acc, [p]: 0 }), {}));
                    setTransactions([]);
                    showNotification('遊戲已重置');
                }
            };

            const handleSubmitScore = async () => {
                if (!winner) { showNotification('請選擇贏家', 'error'); return; }
                if (!isSelfDraw && !loser) { showNotification('請選擇放槍者', 'error'); return; }

                setLoading(true);
                const amount = parseInt(manualAmount);
                const newScores = { ...scores };
                let transactionDesc = '';
                const timestamp = new Date().toLocaleString('zh-TW');

                if (isSelfDraw) {
                    players.forEach(p => {
                        if (p === winner) newScores[p] += amount * 3;
                        else newScores[p] -= amount;
                    });
                    transactionDesc = `${winner} 自摸 ${taiCount} 台 (每家 ${amount} pt)`;
                } else {
                    newScores[winner] += amount;
                    newScores[loser] -= amount;
                    transactionDesc = `${loser} 放槍給 ${winner} (${taiCount} 台, ${amount} pt)`;
                }

                const newRecord = {
                    id: Date.now(),
                    time: timestamp,
                    winner,
                    loser: isSelfDraw ? '三家' : loser,
                    type: isSelfDraw ? '自摸' : '放槍',
                    tai: taiCount,
                    amount: amount,
                    totalExchanged: isSelfDraw ? amount * 3 : amount,
                    desc: transactionDesc
                };

                setScores(newScores);
                setTransactions([newRecord, ...transactions]);
                
                // 重置選擇
                setWinner(null);
                setLoser(null);
                setTaiCount(1);
                setIsSelfDraw(false);

                if (googleScriptUrl) {
                    try {
                        await fetch(googleScriptUrl, {
                            method: 'POST',
                            mode: 'no-cors', 
                            body: JSON.stringify(newRecord)
                        });
                        showNotification('紀錄已儲存並同步至 Google');
                    } catch (error) {
                        showNotification('儲存成功，但 Google 同步失敗', 'error');
                    }
                } else {
                    showNotification('紀錄已儲存 (本地)');
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-emerald-900 text-white font-sans max-w-md mx-auto shadow-2xl flex flex-col">
                    <header className="bg-emerald-800 p-4 flex justify-between items-center shadow-md">
                        <h1 className="text-xl font-bold flex items-center gap-2">
                            <div className="w-8 h-8 bg-white text-emerald-800 rounded flex items-center justify-center font-serif font-black border-2 border-emerald-600">發</div>
                            麻將計分
                        </h1>
                        <div className="flex gap-2">
                            <button onClick={() => setView('history')} className={`p-2 rounded ${view === 'history' ? 'bg-emerald-600' : 'hover:bg-emerald-700'}`}>
                                <History size={20} />
                            </button>
                            <button onClick={() => setView('settings')} className={`p-2 rounded ${view === 'settings' ? 'bg-emerald-600' : 'hover:bg-emerald-700'}`}>
                                <Settings size={20} />
                            </button>
                        </div>
                    </header>

                    {notification && (
                        <div className={`p-3 text-center text-sm font-bold ${notification.type === 'error' ? 'bg-red-500' : 'bg-green-500'} transition-all`}>
                            {notification.msg}
                        </div>
                    )}

                    <main className="flex-1 overflow-y-auto p-4">
                        {view === 'scorer' && (
                            <div className="space-y-6">
                                <div className="grid grid-cols-4 gap-2 bg-emerald-800 p-3 rounded-xl border border-emerald-700">
                                    {players.map((p) => (
                                        <div key={p} className="text-center">
                                            <div className="text-emerald-200 text-xs mb-1 truncate">{p}</div>
                                            <div className={`font-mono font-bold text-lg ${scores[p] >= 0 ? 'text-yellow-400' : 'text-red-400'}`}>
                                                {scores[p] > 0 ? `+${scores[p]}` : scores[p]}
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="bg-emerald-800/50 p-4 rounded-xl border border-emerald-700">
                                    <div className="mb-4">
                                        <label className="text-emerald-200 text-sm mb-2 block flex items-center gap-2"><CheckCircle size={14} /> 贏家 (胡牌)</label>
                                        <div className="grid grid-cols-4 gap-2">
                                            {players.map(p => (
                                                <button key={p} onClick={() => setWinner(p)} className={`py-3 rounded-lg font-bold transition-all ${winner === p ? 'bg-yellow-500 text-emerald-900 scale-105 shadow-lg' : 'bg-emerald-700 text-emerald-100'}`}>{p}</button>
                                            ))}
                                        </div>
                                    </div>

                                    <div className="mb-4">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-emerald-200 text-sm flex items-center gap-2"><AlertCircle size={14} /> 放槍者 / 自摸</label>
                                            <button onClick={() => { setIsSelfDraw(!isSelfDraw); setLoser(null); }} className={`text-xs px-3 py-1 rounded-full border ${isSelfDraw ? 'bg-yellow-500 text-emerald-900 border-yellow-500 font-bold' : 'border-emerald-500 text-emerald-300'}`}>
                                                {isSelfDraw ? '目前：自摸' : '切換為自摸'}
                                            </button>
                                        </div>
                                        {!isSelfDraw ? (
                                            <div className="grid grid-cols-4 gap-2">
                                                {players.map(p => (
                                                    <button key={p} disabled={winner === p} onClick={() => setLoser(p)} className={`py-3 rounded-lg font-bold transition-all ${winner === p ? 'opacity-20 bg-emerald-900' : loser === p ? 'bg-red-500 text-white' : 'bg-emerald-700'}`}>{p}</button>
                                                ))}
                                            </div>
                                        ) : (
                                            <div className="bg-emerald-900/50 p-3 rounded-lg text-center text-yellow-300 text-sm border border-yellow-500/30">🎉 自摸！三家通賠</div>
                                        )}
                                    </div>

                                    <div className="bg-emerald-900/50 p-4 rounded-lg border border-emerald-600 space-y-4">
                                        <div>
                                            <label className="flex justify-between text-sm text-emerald-200 mb-1"><span>台數</span><span className="font-mono">{taiCount} 台</span></label>
                                            <input type="range" min="0" max="20" value={taiCount} onChange={(e) => setTaiCount(parseInt(e.target.value))} className="w-full accent-yellow-500" />
                                        </div>
                                        <div className="flex items-end gap-3">
                                            <div className="flex-1">
                                                <label className="text-xs text-emerald-400 block mb-1">單家點數</label>
                                                <input type="number" value={manualAmount} onChange={(e) => setManualAmount(parseInt(e.target.value))} className="w-full bg-emerald-800 border border-emerald-600 rounded p-2 text-xl font-mono text-white focus:outline-none" />
                                            </div>
                                            <div className="text-right text-[10px] text-emerald-400 mb-2">公式: {baseScore}+{taiCount}×{taiScore}</div>
                                        </div>
                                    </div>

                                    <button onClick={handleSubmitScore} disabled={loading} className="w-full mt-6 bg-yellow-500 text-emerald-900 font-bold py-4 rounded-xl shadow-lg active:scale-95 flex items-center justify-center gap-2 text-lg">
                                        {loading ? '同步中...' : <><Calculator size={24} /> 確認記分</>}
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'settings' && (
                            <div className="space-y-6">
                                <button onClick={() => setView('scorer')} className="w-full bg-yellow-500 text-emerald-900 font-bold py-3 rounded-lg shadow-lg flex items-center justify-center gap-2"><CheckCircle size={20} /> 完成設定 / 開始計分</button>
                                
                                <div className="bg-emerald-800 p-4 rounded-xl border border-emerald-700">
                                    <h3 className="font-bold mb-4 flex items-center gap-2 text-yellow-400"><Users size={18} /> 玩家名稱</h3>
                                    <div className="grid grid-cols-2 gap-3">
                                        {players.map((p, idx) => (
                                            <input key={idx} type="text" value={p} onChange={(e) => {
                                                const newPlayers = [...players];
                                                newPlayers[idx] = e.target.value;
                                                setPlayers(newPlayers);
                                            }} className="bg-emerald-900 border border-emerald-600 rounded p-2 text-white" />
                                        ))}
                                    </div>
                                </div>

                                <div className="bg-emerald-800 p-4 rounded-xl border border-emerald-700">
                                    <h3 className="font-bold mb-4 flex items-center gap-2 text-yellow-400"><Calculator size={18} /> 計分規則</h3>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div><label className="text-xs">底</label><input type="number" value={baseScore} onChange={(e) => setBaseScore(parseInt(e.target.value))} className="w-full bg-emerald-900 border border-emerald-600 rounded p-2" /></div>
                                        <div><label className="text-xs">台</label><input type="number" value={taiScore} onChange={(e) => setTaiScore(parseInt(e.target.value))} className="w-full bg-emerald-900 border border-emerald-600 rounded p-2" /></div>
                                    </div>
                                </div>

                                <div className="bg-emerald-800 p-4 rounded-xl border border-emerald-700">
                                    <h3 className="font-bold mb-2 flex items-center gap-2 text-green-400"><FileSpreadsheet size={18} /> Google Script URL</h3>
                                    <input type="text" value={googleScriptUrl} onChange={(e) => setGoogleScriptUrl(e.target.value)} className="w-full bg-emerald-900 border border-emerald-600 rounded p-2 text-[10px] break-all text-emerald-200" />
                                </div>

                                <button onClick={handleResetGame} className="w-full py-3 border border-red-500 text-red-400 rounded-lg flex items-center justify-center gap-2"><RotateCcw size={16} /> 重置所有數據</button>
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="h-full flex flex-col">
                                <button onClick={() => setView('scorer')} className="mb-4 text-emerald-300 flex items-center gap-1">← 返回記分板</button>
                                <div className="flex-1 overflow-y-auto space-y-2 pb-4">
                                    {transactions.length === 0 ? <div className="text-center text-emerald-500 mt-10">暫無紀錄</div> : 
                                        transactions.map((t) => (
                                            <div key={t.id} className="bg-emerald-800 p-3 rounded-lg border-l-4 border-yellow-500 flex justify-between items-center">
                                                <div>
                                                    <div className="text-[10px] text-emerald-400">{t.time.split(' ')[1]}</div>
                                                    <div className="text-sm font-bold">{t.desc}</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-yellow-400 font-mono font-bold">{t.totalExchanged} pt</div>
                                                    <div className="text-[10px] text-emerald-400">{t.type}</div>
                                                </div>
                                            </div>
                                        ))
                                    }
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="p-2 text-center text-[10px] text-emerald-700 border-t border-emerald-800">Mahjong Calc v1.1</footer>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
